# A genuine pure scan (no text layer) with real OCR damage throughout -- the
# document that motivated the Phase 5 VLM-alignment work earlier this session
# (the crop-coordinate fix, content-anchored row matching, the unusable-read
# safety net). Three of the four figures below were independently confirmed
# against the printed page in that investigation and are the anchor this case
# exists to hold: Property, Plant & Equipment / Capital work in progress /
# Other Intangible Assets all read correctly, cleanly, with no OCR damage on
# the CURRENT (31 March 2025) column, exactly as they did the day the
# crop/alignment fixes landed.
#
# Values are the RAW printed digits, e.g. "28,455" -> 28455.0 -- confirmed
# directly (`parse_cell("28,455").value == 28455.0`) that this pipeline does
# NOT apply the page's own "(Amount in '000)" unit scale at parse time; that
# scale is carried separately (UnitResolver) for the reader, not multiplied
# into the figure. An earlier draft of this file got that wrong by scaling
# every value x1000 before it was ever run against the pipeline -- caught by
# checking parse_cell directly rather than trusting the assumption.
#
# Deliberately does NOT include "Investment Properties", which IS damaged on
# this page (docling reads "8Z5'E") -- re-checking it live while building this
# case surfaced a genuinely new, different gap worth its own investigation: a
# cell whose raw text fails to parse as a number AT ALL currently reaches the
# final output completely unmarked, neither a value nor an [unreadable:...]
# marker, because verify.py's reason-flagging is conditioned on SPECIFIC
# parseable-but-suspect patterns (sign_uncertain, grouping_odd, ...) and finds
# none of them in unparseable garbage. Not fixed here; flagged for its own pass.

