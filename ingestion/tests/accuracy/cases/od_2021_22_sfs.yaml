# Startup Odisha's first (one-day) period, 30-31 March 2022. Ground truth read
# off the printed pages by eye, pages 1-2 of the PDF.
#
# THE case for a table docling's layout model never detects: page 2 (the
# Statement of Income & Expenditure) has almost no ruling lines, so layout
# analysis produced 55 clusters and none a table. OCR read every figure; before
# structure_repair.synthesize_table nothing assembled them and
# emit.build_text_records dropped each for being under 25 characters -- every
# figure below scored MISSING with no marker anywhere.
#
# Page 1 (balance sheet) had two further defects, both now fixed and pinned
# here: the grid came back with the label in the SECOND column (a spanned first
# row made tables.py choose the blank first column, so every label read blank),
# and docling's table box stopped at the liabilities subtotal, so the whole
# assets side (Cash 14,99,540) was read by OCR and dropped. See
# tables._resolve_roles and structure_repair.synthesize_continuation.

