# The document that motivated the Phase 1 OCR fix: 22 pages, ALL carrying a
# genuine PDF text layer -- and, before that fix, extracted 0 tables, 0
# chunks, 0 notes. `pages_to_pdf()` rasterises every page before docling ever
# sees it, so `do_ocr=False` (the old behaviour for an all-digital document)
# meant there was nothing left to read at all. Ground truth here is read off
# pages 1-2 of the rendered PDF by eye, the same discipline
# tests/fixtures/README.md sets out.
#
# Deliberately includes figures the pipeline does NOT currently produce
# correctly. Four rows on the balance sheet are genuinely legible on the page
# -- Share capital, Refundable Grant, Trade payables, Other current
# liabilities -- and come back WITHHELD or entirely MISSING today, the latter
# because a label and its note number/values ended up split across adjacent
# rows (verified in the raw table_md: "(b) Trade payables | 4 | | |" is blank,
# and a separately-mislabelled row further down carries note "5" with
# Other current liabilities' true values under a synthetic label). This is
# NOT the same defect as the enumerator-merge class already fixed; recording
# it here is exactly the point of a scoreboard -- it should fail today and
# start passing once Phase 3's arbitration lands.

