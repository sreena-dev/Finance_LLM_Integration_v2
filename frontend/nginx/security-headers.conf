# ---------------------------------------------------------------------------
# Shared response headers, kept in a snippet because of an nginx inheritance
# rule that is easy to get wrong: `add_header` in a location does not add to
# the server-level ones, it REPLACES the whole inherited set. So a location
# that sets its own Cache-Control silently loses every security header defined
# on the server — and `/` is exactly such a location, since try_files rewrites
# it internally to /index.html.
#
# Including this file everywhere an `add_header` appears is what keeps the
# headers present on every response instead of only on some.
#
# This snippet lives outside /etc/nginx/conf.d/ on purpose: that directory is a
# tmpfs at runtime (the envsubst target), so a static file placed there at
# build time would be masked by the mount.
# ---------------------------------------------------------------------------

# This app is same-origin only and embeds no third-party frames.
add_header X-Content-Type-Options nosniff     always;
add_header X-Frame-Options        SAMEORIGIN  always;
add_header Referrer-Policy        same-origin always;
